    <!-- Script Error Guard: logs cross-origin errors from embedded iframes instead of crashing -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.message === 'Script error.' || !e.filename) {
          if (typeof console !== 'undefined' && console.debug) {
            console.debug('[Legends] Suppressed cross-origin script error');
          }
          e.preventDefault();
          return true;
        }
      }, true);
      window.onerror = function(msg, url) {
        if (msg === 'Script error.' || !url) {
          return true;
        }
      };
    </script>
