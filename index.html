            msg.indexOf('Importing a module script failed') !== -1 ||
            msg.indexOf('error loading dynamically imported module') !== -1) {
          var hasReloaded = sessionStorage.getItem('legends_chunk_reload');
          if (!hasReloaded) {
            sessionStorage.setItem('legends_chunk_reload', '1');
            window.location.reload();
          }
        }
        if (msg === 'Script error.' || !e.filename) {
          e.preventDefault();
          return true;
        }
      }, true);
      window.onerror = function(msg, url) {
        if (msg === 'Script error.' || !url) {
          return true;
        }
      };
    </script>
